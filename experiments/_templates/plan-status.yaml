schema_version: "1.0"
experiment_id: "<YYYYMMDD_HHMMSS>"
plan_id: "PNN"
sequence: 0
baseline_path: "plans/NN-<name>.md"
status: "draft"
approval:
  state: "pending"
  authority: null
  approved_at: null
updated_at: "<ISO-8601 timestamp>"
current_step: null
