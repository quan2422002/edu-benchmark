schema_version: "1.0"
config_id: "repository-hygiene-20260812-v1"
repository_root: "../../.."
output_root: "experiments/20260806_145124/outputs/plan06"
scan_roots:
  - "."
exclude_globs:
  - ".git/**"
  - ".pytest_cache/**"
  - "**/__pycache__/**"
  - "**/*.pyc"
  - ".env"
  - "**/.env"
  - "document/**"
  - "google-cloud-sdk/**"
  - "experiments/20260806_145124/**"
duplicate_min_bytes: 1048576
targets:
  - target_id: "full-batch-judge-jsonl"
    path_globs:
      - "experiments/20260727_170150/outputs/benchmark_evaluation/full_1400_v1/judge_full_batch_gold_answer_only_v4/**/*.jsonl"
    reference_terms:
      - "judge_full_batch_gold_answer_only_v4"
    artifact_class: "raw_provider_output"
    proposed_action: "keep"
    approval_state: "plan_approved"
    locator_required: false
    restore_test_required: false
    rationale: "Keep paid-run inputs and outputs at their original experiment paths as local ignored payloads; do not use Git LFS or consolidate them under shared."
  - target_id: "target-response-jsonl"
    path_globs:
      - "experiments/20260727_170150/outputs/benchmark_evaluation/full_1400_v1/target_*/*.jsonl"
    reference_terms:
      - "target_gemini35"
      - "target_llama4_maverick"
    artifact_class: "raw_provider_output"
    proposed_action: "keep"
    approval_state: "plan_approved"
    locator_required: false
    restore_test_required: false
    rationale: "Keep generated target responses at their original experiment paths as local ignored payloads so their run context remains visible."
  - target_id: "judge-pilot-and-smoke-jsonl"
    path_globs:
      - "experiments/20260727_170150/outputs/benchmark_evaluation/full_1400_v1/judge_cost_pilot_30/**/*.jsonl"
      - "experiments/20260727_170150/outputs/benchmark_evaluation/judge_smoke_*/*.jsonl"
