      - "judge_smoke_"
      - "smoke_gemini35_"
      - "smoke_llama4_maverick_"
    artifact_class: "raw_provider_output"
    proposed_action: "keep"
    approval_state: "plan_approved"
    locator_required: false
    restore_test_required: false
    rationale: "Keep pilot and smoke JSONL at their original experiment paths as local ignored historical evidence."
  - target_id: "requirement-scoring-jsonl"
    path_globs:
