    artifact_class: "raw_provider_output"
    proposed_action: "keep"
    approval_state: "plan_approved"
    locator_required: false
    restore_test_required: false
    rationale: "Keep raw scoring generations at their original experiment paths as local ignored scientific provenance."
  - target_id: "shared-learning-source-payloads"
    path_globs:
      - "shared/raw_data/**/*"
      - "shared/learning_resources/raw_page_images/**/*"
      - "shared/learning_resources/compiled_documents/**/*.pdf"
    reference_terms:
      - "shared/raw_data/"
      - "shared/learning_resources/raw_page_images/"
      - "shared/learning_resources/compiled_documents/"
    artifact_class: "shared_restricted_source"
    proposed_action: "keep"
    approval_state: "plan_approved"
    locator_required: true
    restore_test_required: true
    rationale: "Source learning materials and restricted raw data are not rebuildable and need an approved storage authority."
  - target_id: "rebuildable-learning-indexes"
    path_globs:
      - "shared/learning_resources/indexes/*.sqlite"
      - "shared/learning_resources/indexes/*.sqlite3"
      - "shared/learning_resources/indexes/*.db"
      - "shared/learning_resources/indexes/*.duckdb"
    reference_terms:
      - "shared/learning_resources/indexes/"
    artifact_class: "derived_rebuildable"
    proposed_action: "keep"
    approval_state: "plan_approved"
    locator_required: false
    restore_test_required: true
    rationale: "Keep the local ignored search index; the project lead explicitly declined deletion even though it is rebuildable."
